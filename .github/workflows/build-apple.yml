name: Build macOS + iOS apps

# Real macOS/iOS builds need Apple's own toolchain (Xcode, codesign, hdiutil) --
# none of which exist for Windows or Linux. This is the only way to produce
# genuine macOS/iOS artifacts without owning a Mac: a macOS GitHub-hosted
# runner. Unsigned builds (this workflow, as-is) need no Apple account at
# all; running on a physical iPhone or shipping to the App Store additionally
# needs a paid Apple Developer account and real signing certificates, which
# this workflow does NOT attempt (that's a one-time manual setup on
# developer.apple.com plus a few extra `xcodebuild` flags, not something
# that can be scripted without your account's credentials).
on:
  push:
    branches: [main]
    paths:
      - "nancy-billion/desktop/**"
      - "nancy-billion/mobile/**"
      - "nancy-billion/frontend/**"
      - ".github/workflows/build-apple.yml"
  workflow_dispatch: {}

jobs:
  build-macos-desktop:
    name: macOS desktop (.dmg)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: nancy-billion/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build unsigned .dmg
        # No CSC_LINK/CSC_KEY_PASSWORD set -> electron-builder produces an
        # unsigned, ad-hoc .dmg. Real signing needs a Developer ID
        # Application certificate exported as a .p12 and added as repo
        # secrets CSC_LINK (base64) + CSC_KEY_PASSWORD, then this same
        # command signs automatically -- electron-builder auto-detects it.
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: billion-macos-dmg
          path: nancy-billion/desktop/dist/*.dmg
          if-no-files-found: error

  build-ios:
    name: iOS (Simulator build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: nancy-billion/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile dependencies
        run: npm install

      # mobile/www/ is a small static "host finder" shell (already checked
      # into the repo) that redirects to wherever the real Next.js control
      # room is running on the user's own machine -- it is NOT a bundled
      # copy of the frontend, so there is nothing to build here.

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate icons/splash
        run: npx capacitor-assets generate --iconBackgroundColor '#05080e' --iconBackgroundColorDark '#05080e' --splashBackgroundColor '#05080e' --splashBackgroundColorDark '#05080e' || true

      - name: Sync web assets into the native project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: nancy-billion/mobile/ios/App
        run: pod install

      - name: Build for the iOS Simulator (unsigned -- no Apple account needed)
        working-directory: nancy-billion/mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: billion-ios-simulator-app
          path: nancy-billion/mobile/ios/App/build/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error

      # --- Real device / TestFlight / App Store build -------------------
      # Requires, as GitHub repo secrets, all added manually on
      # developer.apple.com + GitHub's repo settings (never generated by CI):
      #   APPLE_CERTIFICATE_P12 (base64), APPLE_CERTIFICATE_PASSWORD,
      #   APPLE_PROVISIONING_PROFILE (base64), APPLE_TEAM_ID
      # Then swap the simulator build step above for a real `-sdk iphoneos`
      # archive + `xcodebuild -exportArchive` with an ExportOptions.plist
      # referencing those. Left out here since it can't run without your
      # actual Apple Developer account.
