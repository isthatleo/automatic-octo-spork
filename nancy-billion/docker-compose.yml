services:
  backend:
    build:
      # One level above nancy-billion/ (i.e. automatic-octo-spork/), not
      # ./backend -- requirements.txt has a real editable dependency on the
      # sibling fury-main package (tools.py needs it unconditionally, not
      # just optionally for TTS), which lives outside nancy-billion/ entirely.
      # See backend/Dockerfile's top comment and ../.dockerignore.
      context: ..
      dockerfile: nancy-billion/backend/Dockerfile
    container_name: nancy-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides .env's PHONEMIZER_ESPEAK_LIBRARY, which is a Windows path
      # (C:\Program Files\eSpeak NG\libespeak-ng.dll) -- correct for running
      # main_new.py natively on Windows, meaningless inside this Linux
      # container, where it made NeuTTS's phonemizer step fail with "espeak
      # not installed on your system" (confirmed live: the real underlying
      # error was PHONEMIZER_ESPEAK_LIBRARY pointing at a non-existent
      # Windows path, not espeak actually being missing -- espeak-ng is
      # installed and working at /usr/bin/espeak-ng). Compose's `environment`
      # takes precedence over `env_file` for the same key, so this is
      # container-only and leaves .env correct for native Windows runs.
      - PHONEMIZER_ESPEAK_LIBRARY=/usr/lib/x86_64-linux-gnu/libespeak-ng.so.1
    volumes:
      # Bind-mount so the real persisted stores (webhooks.json, cron_jobs.json,
      # skills.json, memory_graph.json, economic_calendar.json, memory.sqlite,
      # fury_history/) survive a container rebuild instead of living only in
      # the ephemeral container filesystem.
      - ./backend/data:/app/data
      - ./backend/voice_ref:/app/voice_ref
      # Real host Docker-daemon access for docker_tool.py (docker_ps/logs/
      # build/compose/restart) -- a deliberate, documented privilege grant:
      # anything that can use this socket can effectively control the host's
      # Docker daemon (container escape risk if this backend were ever
      # compromised). Enabled per explicit user decision. On Windows Docker
      # Desktop the path below is correct as-is (Desktop exposes the same
      # /var/run/docker.sock path inside its Linux VM to any Linux container).
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    # `docker compose watch` -- run alongside `docker compose up` to keep
    # this container in step with source edits automatically. main_new.py
    # is a plain `python main_new.py` (no uvicorn --reload), so a normal
    # code edit is synced in and the process restarted; a dependency change
    # (requirements.txt) or an edit to the real fury-main package this
    # image pip-installs from at build time (../fury-main -- see
    # Dockerfile's top comment) needs a full image rebuild instead, since
    # those are baked into the image rather than just copied in.
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - ./backend/data
            - ./backend/voice_ref
            - "**/__pycache__"
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ../fury-main

  frontend:
    build:
      # Root context, not ./frontend -- this is an npm-workspaces monorepo,
      # so the Dockerfile needs the root package.json/package-lock.json
      # alongside frontend/ (see frontend/Dockerfile's top comment).
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nancy-frontend
    ports:
      - "3005:3005"
    environment:
      # Server-side only (not NEXT_PUBLIC_-prefixed, so it's never baked into
      # the browser bundle) -- Next.js API routes (app/api/**/route.ts) run
      # INSIDE this container and need the Docker Compose service DNS name to
      # reach the backend container. NEXT_PUBLIC_BACKEND_URL stays unset/
      # defaults to localhost:8000 deliberately: that one IS shipped to the
      # browser, and the browser runs on the host, where localhost:8000 is
      # the real published port. Confirmed live: without this, every
      # Next.js-proxied REST route (canvas, missions, greeting, tts, voice,
      # ...) 502'd from inside the container while the WS-based chat path
      # (a direct browser->host:8000 connection, no server-side proxy
      # involved) worked fine -- two different network paths, only one of
      # which was ever configured correctly.
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    # This image runs a production build (`next build` then `next start`),
    # not a dev server, so there's no live process to sync source into --
    # every real change needs the image rebuilt and the container recreated
    # rather than a lighter sync+restart.
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - ./frontend/node_modules
            - ./frontend/.next
            - ./frontend/dev.log

  # Local offline LLM fallback -- opt-in only (`docker compose --profile
  # ollama up`), since get_llm_backends() already prioritizes the cloud
  # backends configured in backend/.env and only falls back to Ollama if
  # those aren't set. Not started by a plain `docker compose up` so a normal
  # run doesn't block on a multi-GB model pull nobody asked for.
  ollama:
    image: ollama/ollama:latest
    container_name: nancy-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped

  # Real Langflow (langflowai/langflow, the official image) as a genuine
  # sibling service, not a pip dependency merged into backend's own Python
  # environment -- Langflow pulls a large LangChain-adjacent dependency
  # tree that risks the exact pathological pip-resolver backtracking this
  # project already hit once with a much smaller addition. backend/
  # langflow_client.py talks to it over its real REST API
  # (LANGFLOW_BASE_URL, defaults to this service's compose DNS name).
  # Opt-in only (`docker compose --profile langflow up`), same reasoning
  # as ollama above -- a large image nobody should be forced to pull.
  langflow:
    image: langflowai/langflow:latest
    container_name: nancy-langflow
    profiles: ["langflow"]
    ports:
      - "7860:7860"
    # Confirmed live: Langflow's real startup hard-requires a superuser
    # password (raises "Username and password must be set" and exits if
    # unset) -- same requirement as the official docker-compose.yml at
    # github.com/langflow-ai/langflow/blob/main/docker_example/docker-compose.yml,
    # which sets this from its own .env. Reusing backend/.env directly
    # (real container env, not compose-file ${...} substitution -- that
    # only reads a .env sitting next to this file, not backend/.env) means
    # no separate secrets file to keep in sync. Set LANGFLOW_SUPERUSER_PASSWORD
    # there before starting this profile, or the container fails with that
    # same real error.
    env_file:
      - ./backend/.env
    volumes:
      - ./data/langflow:/app/langflow
    restart: unless-stopped
